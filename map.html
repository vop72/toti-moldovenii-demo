<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Map</title>
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
<script src="content.js?v=cmm1"></script>
<style>
html,body{margin:0;height:100%;background:transparent;overflow:hidden;font-family:var(--f)}
#wrap{position:relative;width:100%;height:100%}
svg{display:block;width:100%;height:100%}
#tip{position:absolute;pointer-events:none;padding:6px 10px;font-size:13px;line-height:1.3;white-space:nowrap;opacity:0;transition:opacity .12s;transform:translate(-50%,calc(-100% - 12px))}
#zoom{position:absolute;left:12px;bottom:12px;display:flex;gap:4px}
#zoom button{font:inherit;font-size:13px;padding:6px 12px;cursor:pointer;border:1px solid;min-height:32px}
.dot{cursor:pointer}
</style>
</head>
<body>
<div id="wrap"><svg id="m" role="img"></svg><div id="tip"></div><div id="zoom" hidden></div></div>
<script>
const q = new URLSearchParams(location.search);
const theme = q.get('theme') || 'a', mode = q.get('mode') || 'mini', lang = q.get('lang') || 'ro';
const P = theme === 'a'
  ? { land: '#E4D8C3', edge: '#F4EDE1', dot: '#6E1F2B', sel: '#C8102E', arc: '#A86F1E', home: '#0046AE', ink: '#262422', tipBg: '#262422', tipInk: '#FAF6EF', ramp: ['#E9D9C0', '#6E1F2B'], font: "'Golos Text',system-ui,sans-serif", btn: '#FAF6EF' }
  : { land: '#E6E4DF', edge: '#FBFAF8', dot: '#1A2440', sel: '#C8102E', arc: '#A3182B', home: '#A3182B', ink: '#1A2440', tipBg: '#1A2440', tipInk: '#FFFFFF', ramp: ['#F3D9DC', '#A3182B'], font: "'Onest',system-ui,sans-serif", btn: '#FFFFFF' };
document.documentElement.style.setProperty('--f', P.font);
const { COMMUNITIES, COUNTRIES, HOME } = window.TM;
const svg = d3.select('#m'), tip = document.getElementById('tip');
Object.assign(tip.style, { background: P.tipBg, color: P.tipInk });
let selected = q.get('sel') || null, view = 'world', world;
const L = { world: { ro: 'Lume', ru: 'Мир', en: 'World' }, eu: { ro: 'Europa', ru: 'Европа', en: 'Europe' } };
const fmt = n => '~' + n.toLocaleString(lang === 'en' ? 'en-GB' : lang === 'ru' ? 'ru-RU' : 'ro-RO');

function show(e, html) {
  const r = document.getElementById('wrap').getBoundingClientRect();
  tip.innerHTML = html; tip.style.left = (e.clientX - r.left) + 'px'; tip.style.top = (e.clientY - r.top) + 'px'; tip.style.opacity = 1;
}
function hide() { tip.style.opacity = 0; }

function draw() {
  if (!world) return;
  const w = innerWidth, h = innerHeight;
  svg.attr('viewBox', `0 0 ${w} ${h}`).selectAll('*').remove();
  const countries = topojson.feature(world, world.objects.countries).features.filter(f => f.id !== '010');
  const proj = d3.geoNaturalEarth1();
  if (view === 'eu') proj.fitExtent([[10, 10], [w - 10, h - 10]], { type: 'MultiPoint', coordinates: [[-11, 36], [42, 36], [-11, 61], [42, 61]] });
  else proj.fitExtent([[6, 6], [w - 6, h - 6]], { type: 'FeatureCollection', features: countries });
  const path = d3.geoPath(proj);
  const byId = Object.fromEntries(COUNTRIES.map(c => [c.id, c]));
  const scale = d3.scaleSqrt().domain([0, 200000]).range([0, 1]);
  const ramp = d3.interpolateRgb(P.ramp[0], P.ramp[1]);
  const g = svg.append('g');
  g.selectAll('path').data(countries).join('path').attr('d', path)
    .attr('fill', f => f.id === '498' ? P.home : (mode === 'choro' && byId[f.id] ? ramp(0.12 + 0.88 * scale(byId[f.id].est)) : P.land))
    .attr('stroke', P.edge).attr('stroke-width', 0.6)
    .on('mousemove', (e, f) => { if (mode === 'choro' && byId[f.id]) show(e, `<b>${byId[f.id].n[lang]}</b> · ${fmt(byId[f.id].est)}`); else if (f.id === '498') show(e, '<b>Moldova</b>'); else hide(); })
    .on('mouseleave', hide);
  const home = proj([HOME.lon, HOME.lat]);
  if (mode !== 'choro') {
    const arcs = svg.append('g').attr('fill', 'none').attr('stroke', P.arc).attr('stroke-opacity', mode === 'mini' ? 0.45 : 0.22).attr('stroke-width', 1);
    COMMUNITIES.forEach(c => {
      const p = proj([c.lon, c.lat]); if (!p) return;
      const mx = (home[0] + p[0]) / 2, my = (home[1] + p[1]) / 2 - Math.hypot(p[0] - home[0], p[1] - home[1]) * 0.22;
      arcs.append('path').attr('d', `M${home[0]},${home[1]} Q${mx},${my} ${p[0]},${p[1]}`);
    });
    const dots = svg.append('g');
    const r = d3.scaleSqrt().domain([100, 2400]).range(mode === 'mini' ? [2.5, 5.5] : [3.5, 8]);
    COMMUNITIES.forEach(c => {
      const p = proj([c.lon, c.lat]); if (!p) return;
      const isSel = c.id === selected;
      const dg = dots.append('g').attr('class', 'dot').attr('transform', `translate(${p})`);
      if (isSel) dg.append('circle').attr('r', r(c.members) + 7).attr('fill', 'none').attr('stroke', P.sel).attr('stroke-width', 2);
      dg.append('circle').attr('r', 12).attr('fill', 'transparent');
      dg.append('circle').attr('r', r(c.members)).attr('fill', isSel ? P.sel : P.dot).attr('stroke', P.edge).attr('stroke-width', 1.2);
      dg.on('mousemove', e => show(e, `<b>${c.city[lang]}</b> · ${c.country[lang]}`)).on('mouseleave', hide)
        .on('click', () => { parent.postMessage({ type: 'tm-pick', id: c.id }, '*'); selected = c.id; draw(); });
    });
  }
  svg.append('g').attr('transform', `translate(${home})`).call(s => {
    s.append('rect').attr('x', -6).attr('y', -6).attr('width', 12).attr('height', 12).attr('transform', 'rotate(45)').attr('fill', P.home).attr('stroke', '#fff').attr('stroke-width', 1.5);
  });
}

if (mode === 'full') {
  const z = document.getElementById('zoom'); z.hidden = false;
  ['world', 'eu'].forEach(k => {
    const b = document.createElement('button'); b.textContent = L[k][lang]; b.dataset.k = k;
    b.onclick = () => { view = k; paint(); draw(); }; z.appendChild(b);
  });
  var paint = () => z.querySelectorAll('button').forEach(b => Object.assign(b.style, b.dataset.k === view ? { background: P.ink, color: P.btn, borderColor: P.ink } : { background: P.btn, color: P.ink, borderColor: P.ink }));
  paint();
}
addEventListener('message', e => { if (e.data && e.data.type === 'tm-select') { selected = e.data.id; draw(); } });
addEventListener('resize', draw);
fetch('countries-110m.json').then(r => r.json()).then(t => { world = t; draw(); });
</script>
</body>
</html>
